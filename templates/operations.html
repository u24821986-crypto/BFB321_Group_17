<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Operations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header class="bg-success text-white py-4 shadow">
        <div class="container d-flex flex-column flex-sm-row align-items-center justify-content-between gap-3">
            <div>
                <p class="small text-warning text-uppercase fw-bold mb-1">Farm operations</p>
                <h1 class="mb-1">Smart Operations</h1>
                <p class="mb-0">Record daily production performance across the farm.</p>
            </div>
            <a href="/dashboard" class="btn btn-warning fw-bold">Dashboard</a>
        </div>
    </header>

    <main class="container py-4">
        <div class="row g-4">

            <!-- 1. Team -->
            <section class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white fw-bold">Team Information</div>
                    <div class="card-body">
                        <form data-endpoint="/api/team">
                            <div class="mb-3">
                                <label class="form-label">Shift Period</label>
                                <select name="shiftPeriod" class="form-select" required>
                                    <option value="Clockin">Clock in</option>
                                    <option value="Clockout">Clock out</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Team Leader <span class="small text-secondary">(required)</span></label>
                                <input type="text" name="teamInfo" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Block</label>
                                <select name="operationBlock" class="form-select" required>
                                    <option value="Block1">Block 1</option>
                                    <option value="Block2">Block 2</option>
                                    <option value="Block3">Block 3</option>
                                    <option value="Block4">Block 4</option>
                                    <option value="Block5">Block 5</option>
                                    <option value="Block6">Block 6</option>
                                    <option value="Block7">Block 7</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Number of Workers</label>
                                <input type="number" name="NumOfWorkers" class="form-control" min="0">
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6"><label class="form-label">Date</label><input type="date" name="DateHarvested" class="form-control"></div>
                                <div class="col-6"><label class="form-label">Time</label><input type="time" name="time" class="form-control"></div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Submit Team Details</button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- 2. Harvest -->
            <section class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white fw-bold">Harvested Crates</div>
                    <div class="card-body">
                        <form data-endpoint="/api/harvest">
                            <div class="mb-3">
                                <label class="form-label">Team Leader <span class="small text-secondary">(required)</span></label>
                                <input type="text" name="Team" class="form-control" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label">Block</label>
                                    <select name="operationBlock" class="form-select">
                                        <option value="Block1">Block 1</option>
                                        <option value="Block2">Block 2</option>
                                        <option value="Block3">Block 3</option>
                                        <option value="Block4">Block 4</option>
                                        <option value="Block5">Block 5</option>
                                        <option value="Block6">Block 6</option>
                                        <option value="Block7">Block 7</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Number of Workers</label>
                                    <input type="number" name="NumOfWorkers" class="form-control" min="0">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Crates Harvested <span class="small text-secondary">(required)</span></label>
                                <input type="number" name="CratesHarvested" class="form-control" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Number of Trees</label>
                                <input type="number" name="NumOfTrees" class="form-control" min="0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Rejected Crates</label>
                                <input type="number" name="RejectedCrates" class="form-control" min="0">
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6"><label class="form-label">Date</label><input type="date" name="DateHarvested" class="form-control"></div>
                                <div class="col-6"><label class="form-label">Time</label><input type="time" name="TimeHarvested" class="form-control"></div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Submit Harvesting Details</button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- 3. Logistics -->
            <section class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white fw-bold">Logistics</div>
                    <div class="card-body">
                        <form data-endpoint="/api/logistics">
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label">Trip Number</label>
                                    <input type="number" name="tripNumber" class="form-control" min="1" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Block</label>
                                    <select name="operationBlock" class="form-select">
                                        <option value="Block1">Block 1</option>
                                        <option value="Block2">Block 2</option>
                                        <option value="Block3">Block 3</option>
                                        <option value="Block4">Block 4</option>
                                        <option value="Block5">Block 5</option>
                                        <option value="Block6">Block 6</option>
                                        <option value="Block7">Block 7</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label">Vehicle Type</label>
                                    <select name="vehicleType" class="form-select" required>
                                        <option value="Truck">Truck</option>
                                        <option value="Tractor">Tractor</option>
                                        <option value="Bakkie">Bakkie</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Registration</label>
                                    <input type="text" name="vehicleInfo" class="form-control" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label">Driver Name</label>
                                    <input type="text" name="driverInfo" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Destination</label>
                                    <select name="destination" class="form-select">
                                        <option value="PackHouse">Pack house</option>
                                        <option value="FarmShed">Farm shed</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label">Crates Initially Loaded</label>
                                    <input type="number" name="numCrates" class="form-control" min="0" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Crates at Destination</label>
                                    <input type="number" name="numCratesDest" class="form-control" min="0" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6"><label class="form-label">Date</label><input type="date" name="DateHarvested" class="form-control"></div>
                                <div class="col-6"><label class="form-label">Departure Time</label><input type="time" name="time" class="form-control"></div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Submit Logistics Details</button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- 4. Notes -->
            <section class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white fw-bold">Operational Notes</div>
                    <div class="card-body">
                        <form data-endpoint="/api/notes">
                            <div class="mb-3">
                                <label class="form-label">Block</label>
                                <select name="operationBlock" class="form-select">
                                    <option value="Block1">Block 1</option>
                                    <option value="Block2">Block 2</option>
                                    <option value="Block3">Block 3</option>
                                    <option value="Block4">Block 4</option>
                                    <option value="Block5">Block 5</option>
                                    <option value="Block6">Block 6</option>
                                    <option value="Block7">Block 7</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">End shift Crates <span class="small text-secondary">(required)</span></label>
                                <input type="number" name="endShiftCrates" class="form-control" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Delays</label>
                                <input type="text" name="delaysInfo" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Additional Notes</label>
                                <input type="text" name="remarksInfo" class="form-control">
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6"><label class="form-label">Date</label><input type="date" name="DateHarvested" class="form-control"></div>
                                <div class="col-6"><label class="form-label">Time</label><input type="time" name="TimeHarvested" class="form-control"></div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Submit Notes</button>
                        </form>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
        const pad = (n) => String(n).padStart(2, "0");

        function setNow() {
            const d = new Date();
            const day = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
            const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
            document.querySelectorAll('input[type="date"]').forEach((i) => i.value = day);
            document.querySelectorAll('input[type="time"]').forEach((i) => i.value = time);
        }
        setNow();

        async function submitForm(event) {
            event.preventDefault();
            const form = event.target;
            const data = Object.fromEntries(new FormData(form).entries());
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = "Saving...";
            btn.disabled = true;

            try {
                const response = await fetch(form.dataset.endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await response.json().catch(() => ({}));
                if (response.ok) {
                    alert(result.message || "Saved successfully");
                    form.reset();
                    setNow();
                } else {
                    alert("Error: " + (result.message || result.error || "The server rejected the data."));
                }
            } catch (error) {
                console.error("API Connection Error:", error);
                alert("Could not connect to the server. If the site was idle, wait 30 seconds and try again.");
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // Keep the free Render server awake while this page is open
        // (it goes to sleep, and loses saved data, after 15 idle minutes).
        setInterval(() => { fetch("/health", { cache: "no-store" }).catch(() => {}); }, 4 * 60 * 1000);

        document.querySelectorAll("form[data-endpoint]").forEach((f) => f.addEventListener("submit", submitForm));
    </script>
</body>
</html>
