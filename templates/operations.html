<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operations - SmartHarvest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f4f7f4; }
    .navbar-brand { font-weight: 700; color: #2e7d32 !important; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-header { background: #2e7d32; color: #fff; font-weight: 600; }
    .btn-primary { background: #2e7d32; border-color: #2e7d32; }
    .btn-primary:hover { background: #256428; border-color: #256428; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">SmartHarvest</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link active" href="/operations">Operations</a>
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/login">Login</a>
    </div>
  </div>
</nav>

<div class="container mb-5">
  <h2 class="mb-4">Daily Operations Entry</h2>

  <div class="row g-4">

    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header">Team Information</div>
        <div class="card-body">
          <form id="teamForm">
            <div class="mb-3">
              <label class="form-label">Team Info</label>
              <input type="text" class="form-control" id="teamInfo" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Operation Block</label>
              <input type="text" class="form-control" id="operationBlock" required />
            </div>
            <button type="submit" class="btn btn-primary">Save Team Info</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header">Harvest Data</div>
        <div class="card-body">
          <form id="harvestForm">
            <div class="mb-3">
              <label class="form-label">Crates Harvested</label>
              <input type="number" class="form-control" id="CratesHarvested" min="0" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Number of Trees</label>
              <input type="number" class="form-control" id="NumOfTrees" min="0" required />
            </div>
            <button type="submit" class="btn btn-primary">Save Harvest</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header">Logistics</div>
        <div class="card-body">
          <form id="logisticsForm">
            <div class="mb-3">
              <label class="form-label">Trip Number</label>
              <input type="number" class="form-control" id="tripNumber" min="1" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Vehicle Type</label>
              <select class="form-select" id="vehicleType" required>
                <option value="">Select vehicle</option>
                <option value="Truck">Truck</option>
                <option value="Bakkie">Bakkie</option>
                <option value="Tractor">Tractor</option>
                <option value="Trailer">Trailer</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Logistics</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header">Operational Notes</div>
        <div class="card-body">
          <form id="notesForm">
            <div class="mb-3">
              <label class="form-label">Delays Info</label>
              <input type="text" class="form-control" id="delaysInfo" />
            </div>
            <div class="mb-3">
              <label class="form-label">Remarks</label>
              <input type="text" class="form-control" id="remarksInfo" />
            </div>
            <button type="submit" class="btn btn-primary">Save Notes</button>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const forms = [
    {
      id: "teamForm",
      endpoint: "/api/team",
      getData: () => ({
        teamInfo: document.getElementById("teamInfo").value,
        operationBlock: document.getElementById("operationBlock").value,
      }),
    },
    {
      id: "harvestForm",
      endpoint: "/api/harvest",
      getData: () => ({
        CratesHarvested: Number(document.getElementById("CratesHarvested").value),
        NumOfTrees: Number(document.getElementById("NumOfTrees").value),
      }),
    },
    {
      id: "logisticsForm",
      endpoint: "/api/logistics",
      getData: () => ({
        tripNumber: Number(document.getElementById("tripNumber").value),
        vehicleType: document.getElementById("vehicleType").value,
      }),
    },
    {
      id: "notesForm",
      endpoint: "/api/notes",
      getData: () => ({
        delaysInfo: document.getElementById("delaysInfo").value,
        remarksInfo: document.getElementById("remarksInfo").value,
      }),
    },
  ];

  forms.forEach(({ id, endpoint, getData }) => {
    const form = document.getElementById(id);
    if (!form) return;
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(getData()),
        });
        const data = await res.json();
        alert(data.message || "Saved");
        form.reset();
      } catch (err) {
        alert("Error saving: " + err.message);
      }
    });
  });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
